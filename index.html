<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olin Lagon — Open Source Projects</title>
<meta name="description" content="Free and open source projects by Olin Lagon. Built in Hawaiʻi, free for anyone to use.">
<link rel="icon" href="https://github.com/olagon.png">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Y7K2NBKKDZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Y7K2NBKKDZ');
</script>
<style>
  :root {
    --page: #ede5d3;
    --surface: #fbf7ec;
    --ink: #33281a;
    --ink-2: #635640;
    --muted: #9a8c70;
    --accent: #0e7490;
    --accent-deep: #0a5a70;
    --hairline: #ddd1b8;
    --grad: linear-gradient(135deg, #0e8aa5, #0a5a70);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1000px 420px at 90% -8%, rgba(14, 116, 144, 0.10), transparent 60%),
      linear-gradient(180deg, #f2ecdd, #e4d9c1);
    background-attachment: fixed;
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 44px 20px 80px; }

  .hero { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 10px; }
  .hero img {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 3px solid var(--surface);
    box-shadow: 0 8px 24px rgba(61, 44, 30, 0.25);
  }
  .hero h1 { font-size: 28px; margin: 0; }
  .hero p { margin: 4px 0 0; color: var(--ink-2); max-width: 560px; }
  .hero-links { display: flex; gap: 9px; margin-top: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 999px;
    color: #fff;
    background: var(--grad);
    box-shadow: 0 4px 14px rgba(14, 116, 144, 0.3);
  }
  .pill.ghost {
    color: var(--ink);
    background: var(--surface);
    border: 1px solid rgba(61, 44, 30, 0.22);
    box-shadow: none;
  }
  .pill:hover { filter: brightness(1.08); }

  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    color: #7c5b33;
    margin: 36px 0 14px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  h2::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--grad);
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(61, 44, 30, 0.08);
    padding: 18px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(61, 44, 30, 0.18); }
  .card h3 { margin: 0; font-size: 16px; color: var(--accent-deep); word-break: break-word; }
  .card p { margin: 0; font-size: 13.5px; color: var(--ink-2); flex: 1; }
  .meta { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .live {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .status { color: var(--muted); font-size: 14px; padding: 20px 4px; }
  .status a { color: var(--accent); font-weight: 600; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
  .foot a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <img src="https://github.com/olagon.png" alt="Olin Lagon">
    <div>
      <h1>Olin Lagon</h1>
      <p>Social entrepreneur and builder in Hawaiʻi. These are my public, open source projects, free for anyone to use, copy, and improve.</p>
      <div class="hero-links">
        <a class="pill" href="https://github.com/olagon" target="_blank" rel="noopener">GitHub</a>
        <a class="pill ghost" href="https://www.linkedin.com/in/olinlagon" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </header>

  <h2>Open source projects</h2>
  <div id="status" class="status">Loading projects from GitHub…</div>
  <div id="grid" class="grid"></div>

  <p class="foot">Made with aloha in Hawaiʻi · <a href="https://github.com/olagon" target="_blank" rel="noopener">github.com/olagon</a></p>
</div>

<script>
'use strict';

const LANG_COLORS = {
  JavaScript: '#f1e05a', TypeScript: '#3178c6', HTML: '#e34c26', CSS: '#563d7c',
  Python: '#3572A5', Shell: '#89e051', Go: '#00ADD8', Ruby: '#701516',
  Java: '#b07219', PHP: '#4F5D95', C: '#555555', 'C++': '#f34b7d', 'C#': '#178600',
  Swift: '#F05138', Kotlin: '#A97BFF', Rust: '#dea584', 'Jupyter Notebook': '#DA5B0B',
  Vue: '#41b883', Dart: '#00B4AB', R: '#198CE7',
};

function timeAgo(iso) {
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days < 1) return 'today';
  if (days < 31) return days + (days === 1 ? ' day ago' : ' days ago');
  const months = Math.floor(days / 30.4);
  if (months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
  const years = Math.floor(months / 12);
  return years + (years === 1 ? ' year ago' : ' years ago');
}

async function load() {
  const status = document.getElementById('status');
  const grid = document.getElementById('grid');
  try {
    const res = await fetch('https://api.github.com/users/olagon/repos?per_page=100&sort=pushed');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let repos = await res.json();
    repos = repos
      .filter((r) => !r.fork && !r.archived && r.name.toLowerCase() !== 'olagon.github.io')
      .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));

    if (!repos.length) {
      status.innerHTML = 'No public projects yet — check back soon, or visit <a href="https://github.com/olagon">github.com/olagon</a>.';
      return;
    }
    status.remove();

    repos.forEach((r) => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = r.html_url;
      card.target = '_blank';
      card.rel = 'noopener';

      const h3 = document.createElement('h3');
      h3.textContent = r.name.replace(/[-_]/g, ' ');
      card.appendChild(h3);

      const p = document.createElement('p');
      p.textContent = r.description || 'No description yet.';
      card.appendChild(p);

      if (r.homepage) {
        const live = document.createElement('span');
        live.className = 'live';
        live.textContent = '→ Live site: ' + r.homepage.replace(/^https?:\/\//, '').replace(/\/$/, '');
        card.appendChild(live);
        card.href = r.homepage; // clicking the card goes to the live app
        const repoLink = document.createElement('span');
        repoLink.className = 'meta';
        repoLink.textContent = 'Source on GitHub: ' + r.full_name;
        card.appendChild(repoLink);
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      if (r.language) {
        const lang = document.createElement('span');
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = LANG_COLORS[r.language] || '#0e7490';
        lang.appendChild(dot);
        lang.appendChild(document.createTextNode(r.language));
        meta.appendChild(lang);
      }
      if (r.stargazers_count > 0) {
        const stars = document.createElement('span');
        stars.textContent = '★ ' + r.stargazers_count;
        meta.appendChild(stars);
      }
      const upd = document.createElement('span');
      upd.textContent = 'Updated ' + timeAgo(r.pushed_at);
      meta.appendChild(upd);
      card.appendChild(meta);

      grid.appendChild(card);
    });
  } catch (e) {
    status.innerHTML = 'Could not load the project list right now. See everything at <a href="https://github.com/olagon" rel="noopener">github.com/olagon</a>.';
  }
}

load();
</script>
</body>
</html>
